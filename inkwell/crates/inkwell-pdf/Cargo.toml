[package]
name = "inkwell-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PDFium integration for Inkwell: PDF normalisation, tile rasterisation, and text extraction."

[dependencies]
inkwell-core = { path = "../inkwell-core" }
pdfium-render = "0.9"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
log = "0.4"

[dev-dependencies]
tempfile = "3"
