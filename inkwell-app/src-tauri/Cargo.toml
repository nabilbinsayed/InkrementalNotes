[package]
name = "inkwell-app"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Inkwell application host — pressure-sensitive PDF annotation app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
inkwell-core = { path = "../../inkwell/crates/inkwell-core" }
inkwell-pdf = { path = "../../inkwell/crates/inkwell-pdf" }
